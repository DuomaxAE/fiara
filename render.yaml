services:
  - type: web
    name: fiara-creations
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fiara-db
          property: connectionString
      - key: WHATSAPP_NUMBER
        value: "918595949626"

databases:
  - name: fiara-db
    plan: free
    region: singapore
    databaseName: fiara
    user: fiara
    diskSizeGB: 15
